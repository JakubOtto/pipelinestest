name: Unit and E2E Tests

on:
  workflow_run:
    workflows: ['Build project']
    types: [completed]

jobs:
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js for tests
        uses: actions/setup-node@v3
        with:
          node-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        env:
          MONGO_URI: mongodb://localhost:27017/testdb
        run: npm run test -- --passWithNoTests

  e2e_tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit_tests

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js for tests
        uses: actions/setup-node@v3
        with:
          node-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests
        env:
          MONGO_URI: mongodb://localhost:27017/testdb
        run: npm run test:e2e
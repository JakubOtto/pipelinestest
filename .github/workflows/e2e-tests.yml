name: E2E Tests

on:
  push:
    branches:
      - '**' #zabezpieczyc zeby na developie sie nie odpalalo
      - '!develop'
  pull_request:
    branches:
      - '**'  

jobs:
  test-e2e:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ping:1})'" 
          --health-interval 10s 
          --health-timeout 10s 
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '21'

    - name: Install dependencies
      run: npm install

    - name: Check MongoDB logs
      run: docker logs $(docker ps -aqf "name=mongo")

    - name: Wait for MongoDB
      run: sleep 30  

    - name: Check MongoDB logs
      run: docker logs <nazwa_kontenera_mongo>

    - name: Run e2e tests
      env:
        MONGO_URI: mongodb://root:dev@localhost:27017/dev
      run: npm run test:e2e

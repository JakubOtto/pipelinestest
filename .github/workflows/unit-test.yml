name: Unit Tests

on:
  push:
    branches:
      - '**'  #zabezpieczyc zeby na developie sie nie odpalalo
      - '!develop'
  pull_request:
    branches:
      - '**'  

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '21'

    - name: Install dependencies
      run: npm install

    - name: Run unit tests
      run: npm run test

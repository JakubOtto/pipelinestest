name: Unit Tests

on:
  push:
    branches:
      - '**'  # Trigger on all branches except develop
      - '!develop'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '21'

    - name: Install dependencies
      run: npm install && npm ci

    - name: Run unit tests
      run: npm run test

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

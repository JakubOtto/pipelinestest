version: '3'
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb-container
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: dev
    ports:
      - '27017:27017'
    options: >-
      --health-cmd "mongo --eval 'db.runCommand({ping:1})'" 
      --health-interval 10s 
      --health-timeout 5s 
      --health-retries 5
    command: ["mongod", "--bind_ip_all"]  # Start MongoDB in a way that allows connections

